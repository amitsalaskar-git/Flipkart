<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flipkart Sample UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
    <div class="logo">Flipkart</div>
    <input type="text" placeholder="Search for products, brands and more">
    <button class="login-btn">Login</button>
</header>

<!-- NAVBAR -->
<nav class="navbar">
    <a href="#">Mobiles</a>
    <a href="#">Fashion</a>
    <a href="#">Electronics</a>
    <a href="#">Home</a>
    <a href="#">Appliances</a>
    <a href="#">Travel</a>
</nav>

<!-- BANNER -->
<section class="banner">
    <h2>Big Billion Days Sale</h2>
    <p>Best deals on mobiles & electronics</p>
</section>

<!-- PRODUCTS -->
<section class="products">
    <div class="product-card">
        <img src="https://via.placeholder.com/150" alt="Product">
        <h3>Smartphone</h3>
        <p>₹14,999</p>
        <button>Add to Cart</button>
    </div>

    <div class="product-card">
        <img src="https://via.placeholder.com/150" alt="Product">
        <h3>Laptop</h3>
        <p>₹49,999</p>
        <button>Add to Cart</button>
    </div>

    <div class="product-card">
        <img src="https://via.placeholder.com/150" alt="Product">
        <h3>Lingeri</h3>
        <p>₹199</p>
        <button>Add to Cart</button>
    </div>

    <div class="product-card">
        <img src="https://via.placeholder.com/150" alt="Product">
        <h3>Headphones</h3>
        <p>₹1,999</p>
        <button>Add to Cart</button>
    </div>
</section>

<!-- FOOTER -->
<footer class="footer">
    <p>© 2026 Sample Flipkart UI | For Practice Only</p>
</footer>

</body>
</html>
